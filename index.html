<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セドリン</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    max-width:450px;
    margin:auto;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}
h1{
    text-align:center;
    color:#2196F3;
}
input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    font-size:16px;
}
button{
    width:100%;
    padding:12px;
    background:#2196F3;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
}
#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    text-align:center;
}
</style>

</head>

<body>

<div class="card">

<h1>セドリン Ver.1</h1>

<input type="text" placeholder="JANコード・商品名">

<input type="number" placeholder="仕入価格">

<select>
<option>Yahooフリマ（5%）</option>
<option>ヤフオク（10%）</option>
<option>ラクマ（10%）</option>
</select>

<select>
<option>送料160円</option>
<option>送料210円</option>
<option>送料215円</option>
<option>送料410円</option>
<option>送料490円</option>
<option>送料750円</option>
<option>送料850円</option>
</select>

<button>判定する</button>

<div id="result">
ここに結果が表示されます
</div>

</div>

</body>
</html>
