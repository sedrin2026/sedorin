<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>セドリン | 利益判定アプリ</title>
    <style>
        :root {
            --primary-color: #2196F3;
            --buy-color: #4CAF50;
            --pass-color: #f44336;
            --bg-color: #f0f2f5;
            --text-color: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }

        input, select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .calc-btn {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1976D2;
            margin-top: 10px;
        }

        .calc-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1976D2;
        }

        #result-area {
            margin-top: 25px;
            display: none; /* 最初は隠す */
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .judgment-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .profit-text {
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* 判定用カラー */
        .buy-bg { background-color: #e8f5e9; color: #2e7d32; border: 2px solid #4CAF50; }
        .pass-bg { background-color: #ffebee; color: #c62828; border: 2px solid #f44336; }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>セドリン 📦</h1>

    <!-- JANコード -->
    <div class="input-group">
        <label>JANコード</label>
        <input type="number" id="janCode" placeholder="バーコード番号（任意）" inputmode="numeric">
    </div>

    <!-- 販売先 -->
    <div class="input-group">
        <label>販売先（手数料）</label>
        <select id="platform">
            <option value="0.05">Yahooフリマ (5%)</option>
            <option value="0.10">ヤフオク (10%)</option>
            <option value="0.10">ラクマ (10%)</option>
        </select>
    </div>

    <!-- 販売価格 -->
    <div class="input-group">
        <label>販売価格 (円)</label>
        <input type="number" id="sellPrice" placeholder="例: 5000" inputmode="numeric">
    </div>

    <!-- 仕入価格 -->
    <div class="input-group">
        <label>仕入価格 (円)</label>
        <input type="number" id="buyPrice" placeholder="例: 2000" inputmode="numeric">
    </div>

    <!-- 送料 -->
    <div class="input-group">
        <label>送料 (円)</label>
        <select id="shipping">
            <option value="160">160円 (ミニ等)</option>
            <option value="210">210円 (ネコポス/ゆうパケ)</option>
            <option value="215">215円 (ゆうパケポスト)</option>
            <option value="410">410円 (宅急便コン)</option>
            <option value="490">490円 (ゆうパケプラス)</option>
            <option value="750">750円 (60サイズ)</option>
            <option value="850">850円 (80サイズ)</option>
        </select>
    </div>

    <button class="calc-btn" onclick="calculate()">利益判定する</button>

    <!-- 結果表示 -->
    <div id="result-area">
        <div id="judgment" class="judgment-text"></div>
        <div class="profit-text">利益: <span id="profitAmount"></span> 円</div>
        <div id="feeDetail" style="font-size: 14px; opacity: 0.8;"></div>
    </div>

    <div class="footer">
        © セドリン Ver 2.0
    </div>
</div>

<script>
    function calculate() {
        // 入力値の取得
        const sellPrice = parseInt(document.getElementById('sellPrice').value);
        const buyPrice = parseInt(document.getElementById('buyPrice').value);
        const platformFeeRate = parseFloat(document.getElementById('platform').value);
        const shippingCost = parseInt(document.getElementById('shipping').value);

        // 未入力チェック
        if (isNaN(sellPrice) || isNaN(buyPrice)) {
            alert('販売価格と仕入価格を入力してください。');
            return;
        }

        // --- 利益計算 ---
        // 1. 販売手数料を計算
        const fee = Math.floor(sellPrice * platformFeeRate);
        
        // 2. 利益計算式：販売価格 − 仕入価格 − 販売手数料 − 送料
        const profit = sellPrice - buyPrice - fee - shippingCost;

        // 結果エリアを表示
        const resultArea = document.getElementById('result-area');
        const judgment = document.getElementById('judgment');
        const profitAmount = document.getElementById('profitAmount');
        const feeDetail = document.getElementById('feeDetail');

        resultArea.style.display = 'block';
        profitAmount.innerText = profit.toLocaleString();
        feeDetail.innerText = `(手数料: ${fee}円 / 送料: ${shippingCost}円)`;

        // --- 判定ロジック ---
        if (profit >= 1000) {
            judgment.innerText = "✅ 買い！";
            resultArea.className = "buy-bg";
            resultArea.classList.remove("pass-bg");
        } else {
            judgment.innerText = "❌ 見送り";
            resultArea.className = "pass-bg";
            resultArea.classList.remove("buy-bg");
        }

        // スマホで結果が見えるように少しスクロール
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: 'smooth'
        });
    }
</script>

</body>
</html>
